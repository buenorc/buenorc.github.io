
<style>
*{box-sizing:border-box;margin:0;padding:0}
.app{min-height:600px;background:var(--color-background-tertiary);font-family:var(--font-sans)}
.hdr{background:#0C447C;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.hdr-logo{font-family:var(--font-serif);font-size:14px;color:#E6F1FB;font-weight:500}
.hdr-sub{font-size:11px;color:#85B7EB;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-user{font-size:12px;color:#B5D4F4}
.hdr-role{font-size:10px;padding:2px 8px;border-radius:4px;background:#042C53;color:#85B7EB;text-transform:uppercase;letter-spacing:.05em}
.btn-logout{font-size:12px;color:#85B7EB;cursor:pointer;border:.5px solid #378ADD;border-radius:4px;padding:4px 10px;background:transparent}
.btn-logout:hover{background:#042C53}
.auth-wrap{min-height:520px;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.auth-card{background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:28px 32px;width:100%;max-width:420px}
.auth-title{font-family:var(--font-serif);font-size:19px;color:var(--color-text-primary);margin-bottom:3px}
.auth-sub{font-size:13px;color:var(--color-text-secondary);margin-bottom:20px}
.fl{display:flex;flex-direction:column;margin-bottom:13px}
.lbl{font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:4px}
.inp,.sel,.ta{border:.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:7px 10px;font-size:13px;background:var(--color-background-primary);color:var(--color-text-primary);width:100%}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:#378ADD}
.ta{min-height:90px;resize:vertical;line-height:1.6;font-family:var(--font-sans)}
.btn-p{width:100%;background:#185FA5;color:#E6F1FB;border:none;border-radius:var(--border-radius-md);padding:9px;font-size:13px;font-weight:500;cursor:pointer;margin-top:6px}
.btn-p:hover{background:#0C447C}
.auth-sw{text-align:center;margin-top:14px;font-size:13px;color:var(--color-text-secondary)}
.auth-sw span{color:#378ADD;cursor:pointer}
.auth-sw span:hover{text-decoration:underline}
.err-box{background:var(--color-background-danger);color:var(--color-text-danger);border:.5px solid var(--color-border-danger);border-radius:var(--border-radius-md);padding:7px 11px;font-size:13px;margin-bottom:10px}
.ok-box{background:var(--color-background-success);color:var(--color-text-success);border:.5px solid var(--color-border-success);border-radius:var(--border-radius-md);padding:7px 11px;font-size:13px;margin-bottom:10px}
.hint-box{background:var(--color-background-secondary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;font-size:12px;color:var(--color-text-secondary);margin-bottom:14px;line-height:1.6}
.hint-box strong{color:var(--color-text-primary);font-weight:500}
.dash{display:grid;grid-template-columns:210px 1fr;min-height:560px}
.sb{background:var(--color-background-primary);border-right:.5px solid var(--color-border-tertiary);padding:16px 0}
.sb-sec{font-size:10px;font-weight:500;letter-spacing:.08em;color:var(--color-text-tertiary);padding:0 14px;margin:14px 0 5px;text-transform:uppercase}
.sb-it{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:13px;color:var(--color-text-secondary);cursor:pointer;border-left:3px solid transparent}
.sb-it:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.sb-it.active{background:#E6F1FB;color:#185FA5;border-left-color:#378ADD;font-weight:500}
.sb-it i{font-size:15px}
.bdc{font-size:10px;min-width:18px;height:18px;border-radius:9px;background:#185FA5;color:#E6F1FB;display:flex;align-items:center;justify-content:center;margin-left:auto;padding:0 5px}
.main{padding:20px;overflow-y:auto}
.ph{margin-bottom:16px}
.pt{font-size:17px;font-weight:500;color:var(--color-text-primary)}
.pd{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 14px}
.stat-lbl{font-size:11px;color:var(--color-text-secondary);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.ms-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ms-card{background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 16px;cursor:pointer}
.ms-card:hover{border-color:var(--color-border-secondary)}
.ms-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ms-title{font-size:13px;font-weight:500;color:var(--color-text-primary);flex:1;min-width:0}
.ms-meta{font-size:11px;color:var(--color-text-tertiary);margin-top:4px}
.ms-acts{display:flex;gap:7px;margin-top:8px}
.tag{font-size:11px;font-weight:500;border-radius:4px;padding:2px 8px;white-space:nowrap}
.tag-draft{background:#D3D1C7;color:#444441}
.tag-sub{background:#B5D4F4;color:#0C447C}
.tag-rev{background:#FAC775;color:#633806}
.tag-reqrev{background:#F5C4B3;color:#711B0B}
.tag-acc{background:#C0DD97;color:#27500A}
.tag-rej{background:#F7C1C1;color:#791F1F}
.btn-sm{font-size:12px;padding:4px 11px;border-radius:var(--border-radius-md);cursor:pointer;border:.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary)}
.btn-sm:hover{background:var(--color-background-secondary)}
.btn-sm.blue{background:#185FA5;color:#E6F1FB;border-color:#185FA5}
.btn-sm.blue:hover{background:#0C447C}
.btn-sm.amber{background:#FAC775;color:#633806;border-color:#EF9F27}
.btn-new{background:#185FA5;color:#E6F1FB;border:none;border-radius:var(--border-radius-md);padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-new:hover{background:#0C447C}
.btn-back{font-size:13px;color:var(--color-text-secondary);cursor:pointer;border:.5px solid var(--color-border-secondary);background:transparent;border-radius:var(--border-radius-md);padding:7px 14px}
.btn-back:hover{background:var(--color-background-secondary)}
.fw{background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:20px}
.fst{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:12px;padding-bottom:8px;border-bottom:.5px solid var(--color-border-tertiary)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg1{display:grid;grid-template-columns:1fr;gap:12px}
.ff{display:flex;flex-direction:column}
.stepper{display:flex;gap:0;margin-bottom:24px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.step:not(:last-child)::after{content:'';position:absolute;top:13px;left:50%;width:100%;height:1px;background:var(--color-border-tertiary);z-index:0}
.st-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;z-index:1;border:2px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-tertiary)}
.step.done .st-dot{background:#185FA5;color:#fff;border-color:#185FA5}
.step.active .st-dot{background:#E6F1FB;color:#185FA5;border-color:#378ADD}
.st-lbl{font-size:10px;color:var(--color-text-tertiary);margin-top:4px;text-align:center}
.step.active .st-lbl{color:#185FA5;font-weight:500}
.step.done .st-lbl{color:var(--color-text-secondary)}
.form-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:14px;border-top:.5px solid var(--color-border-tertiary)}
.author-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;align-items:end;margin-bottom:7px}
.btn-icon{width:30px;height:30px;border-radius:var(--border-radius-md);border:.5px solid var(--color-border-secondary);background:var(--color-background-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text-secondary);font-size:15px;flex-shrink:0}
.btn-icon:hover{background:var(--color-background-danger);color:var(--color-text-danger)}
.btn-icon.add{color:#185FA5}
.btn-icon.add:hover{background:#E6F1FB;color:#185FA5}
.btn-icon.star-on{color:#185FA5}
.btn-icon.star-on:hover{background:#E6F1FB;color:#185FA5}
.file-drop{border:1.5px dashed var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:20px;text-align:center;cursor:pointer;margin-top:7px;color:var(--color-text-secondary);background:var(--color-background-secondary)}
.file-drop:hover{border-color:#378ADD;background:#E6F1FB}
.file-drop i{font-size:26px;display:block;margin-bottom:6px;color:#378ADD}
.file-drop p{font-size:13px}
.file-drop small{font-size:11px;color:var(--color-text-tertiary)}
.flist{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.fi{display:flex;align-items:center;gap:9px;background:var(--color-background-secondary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:7px 11px}
.fi .fn{font-size:12px;flex:1;color:var(--color-text-primary)}
.fi .fc{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--color-background-info);color:var(--color-text-info)}
.fi .fs{font-size:10px;color:var(--color-text-tertiary)}
.rev-alert{background:#FAEEDA;border:.5px solid #EF9F27;border-radius:var(--border-radius-lg);padding:13px 17px;margin-bottom:16px;border-left:4px solid #BA7517}
.rev-alert-title{font-size:13px;font-weight:500;color:#633806;margin-bottom:3px;display:flex;align-items:center;gap:7px}
.rev-alert-body{font-size:12px;color:#854F0B;line-height:1.5}
.rc{background:var(--color-background-secondary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:13px;margin-bottom:10px}
.rc-lbl{font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.rc-text{font-size:13px;color:var(--color-text-primary);line-height:1.6}
.tl{display:flex;flex-direction:column;gap:0;margin-top:10px}
.tl-item{display:flex;gap:10px;padding-bottom:14px;position:relative}
.tl-item:not(:last-child)::after{content:'';position:absolute;left:12px;top:26px;bottom:0;width:1px;background:var(--color-border-tertiary)}
.tl-dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:1}
.tl-dot.done{background:#185FA5;color:#fff}
.tl-dot.active{background:#EF9F27;color:#fff}
.tl-dot.pend{background:var(--color-background-secondary);color:var(--color-text-tertiary);border:1px solid var(--color-border-tertiary)}
.tl-ev{font-size:12px;font-weight:500;color:var(--color-text-primary);padding-top:2px}
.tl-dt{font-size:10px;color:var(--color-text-tertiary);margin-top:1px}
.cl-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-text-secondary);padding:3px 0;cursor:pointer}
.cl-item input[type=checkbox]{accent-color:#185FA5;width:13px;height:13px}
.db-table{width:100%;border-collapse:collapse;font-size:12px}
.db-table th{text-align:left;padding:8px 10px;font-size:10px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;border-bottom:.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.db-table td{padding:9px 10px;border-bottom:.5px solid var(--color-border-tertiary);color:var(--color-text-primary);vertical-align:top}
.db-table tr:last-child td{border-bottom:none}
.db-table tr:hover td{background:var(--color-background-secondary)}
.empty-st{text-align:center;padding:50px 20px;color:var(--color-text-secondary)}
.empty-st i{font-size:36px;display:block;margin-bottom:10px;color:var(--color-border-secondary)}
.empty-st p{font-size:13px;margin-bottom:14px}
.loading-msg{text-align:center;padding:40px;font-size:13px;color:var(--color-text-tertiary)}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{font-size:12px;padding:4px 12px;border-radius:20px;cursor:pointer;border:.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary)}
.filter-btn.active{background:#185FA5;color:#E6F1FB;border-color:#185FA5}
</style>

<div class="app" id="app">
<div class="hdr">
  <div><div class="hdr-logo">JHAE — Journal of Hydrodynamics of Aquatic Ecosystems</div><div class="hdr-sub">Editorial Management System</div></div>
  <div class="hdr-right" id="hdrRight" style="display:none">
    <span class="hdr-user" id="hdrUser"></span>
    <span class="hdr-role" id="hdrRole"></span>
    <button class="btn-logout" onclick="logout()"><i class="ti ti-logout" aria-hidden="true"></i> Sign out</button>
  </div>
</div>
<div id="vc"></div>
</div>

<script>
const EDITOR = { email: 'editor@jhae.org', pass: 'jhae2024', name: 'Prof. de Carvalho Bueno', inst: 'JHAE Editorial Office', role: 'editor' };
const MS_TYPES = ['Original article','Review article','Short communication','Technical note','Letter to the editor','Response to reviewers','Revision'];
const STATUS_LABELS = {draft:'Draft',submitted:'Submitted',under_review:'Under review',revision_required:'Revision required',accepted:'Accepted',rejected:'Rejected'};
const STATUS_CLASS = {draft:'tag-draft',submitted:'tag-sub',under_review:'tag-rev',revision_required:'tag-reqrev',accepted:'tag-acc',rejected:'tag-rej'};

let S = {
  view:'login', authMode:'login', authErr:null, authOk:null,
  currentUser:null, currentRole:null,
  activeTab:'db', formStep:0, editingId:null, viewingId:null,
  draftMs:null, filterStatus:'all',
  users:{}, manuscripts:{}, ready:false
};

function uid(){ return 'ms_'+Math.random().toString(36).slice(2)+Date.now(); }
function dateStr(){ return new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }

async function loadStorage(){
  try {
    const uRes = await window.storage.get('jhae:users', true);
    if(uRes) S.users = JSON.parse(uRes.value);
    const mRes = await window.storage.get('jhae:manuscripts', true);
    if(mRes) S.manuscripts = JSON.parse(mRes.value);
  } catch(e){ S.users = {}; S.manuscripts = {}; }
  S.ready = true;
  render();
}

async function persist(){
  try {
    await window.storage.set('jhae:users', JSON.stringify(S.users), true);
    await window.storage.set('jhae:manuscripts', JSON.stringify(S.manuscripts), true);
  } catch(e){}
}

function isEditor(email){ return email === EDITOR.email; }

function render(){
  const vc = document.getElementById('vc');
  const hr = document.getElementById('hdrRight');
  if(S.currentUser){
    hr.style.display='flex';
    const name = isEditor(S.currentUser) ? EDITOR.name : (S.users[S.currentUser]?.name || S.currentUser);
    const role = isEditor(S.currentUser) ? 'editor' : 'author';
    document.getElementById('hdrUser').textContent = name;
    document.getElementById('hdrRole').textContent = role;
  } else { hr.style.display='none'; }

  if(!S.ready){ vc.innerHTML=`<div class="loading-msg"><i class="ti ti-loader" aria-hidden="true" style="font-size:28px;display:block;margin-bottom:10px;color:var(--color-text-tertiary)"></i>Connecting to shared database…</div>`; return; }
  if(S.view==='login') vc.innerHTML=renderAuth();
  else if(S.view==='dash') vc.innerHTML=renderDash();
  else if(S.view==='form') vc.innerHTML=renderForm();
  else if(S.view==='detail') vc.innerHTML=renderDetail();
  else if(S.view==='reviewer') vc.innerHTML=renderReviewer();
  else if(S.view==='admin') vc.innerHTML=renderAdmin();
}

function renderAuth(){
  const isReg = S.authMode==='register';
  return `<div class="auth-wrap"><div class="auth-card">
    <div class="auth-title">${isReg?'Create account':'Sign in to JHAE'}</div>
    <div class="auth-sub">${isReg?'Register to submit manuscripts':'Access the editorial system'}</div>
    ${S.authErr?`<div class="err-box">${S.authErr}</div>`:''}
    ${S.authOk?`<div class="ok-box">${S.authOk}</div>`:''}
    ${!isReg?`<div class="hint-box"><strong>Editor login:</strong> editor@jhae.org &nbsp;·&nbsp; password: jhae2024<br><strong>Authors:</strong> register a new account below</div>`:''}
    ${isReg?`<div class="fl"><label class="lbl">Full name</label><input class="inp" id="aN" placeholder="Your full name" /></div>`:''}
    <div class="fl"><label class="lbl">Email address</label><input class="inp" id="aE" placeholder="you@institution.edu" type="email" /></div>
    <div class="fl"><label class="lbl">Password</label><input class="inp" id="aP" placeholder="Password" type="password" /></div>
    ${isReg?`<div class="fl"><label class="lbl">Institution</label><input class="inp" id="aI" placeholder="University / Research center" /></div>`:''}
    <button class="btn-p" onclick="doAuth()">${isReg?'Create account':'Sign in'}</button>
    <div class="auth-sw">${isReg?'Already have an account? <span onclick="swAuth(\'login\')">Sign in</span>':"Don't have an account? <span onclick=\"swAuth('register')\">Register</span>"}</div>
  </div></div>`;
}

function swAuth(m){ S.authMode=m; S.authErr=null; S.authOk=null; render(); }

async function doAuth(){
  const email=(document.getElementById('aE')?.value||'').trim().toLowerCase();
  const pass=document.getElementById('aP')?.value||'';
  if(!email||!pass){ S.authErr='Please fill in all fields.'; render(); return; }

  if(S.authMode==='login'){
    // Editor: hardcoded, never stored in shared DB
    if(email === EDITOR.email){
      if(pass !== EDITOR.pass){ S.authErr='Incorrect password for editor account.'; render(); return; }
      S.currentUser = EDITOR.email;
      S.currentRole = 'editor';
      S.authErr=null; S.authOk=null; S.view='admin'; render(); return;
    }
    // Author: check shared storage
    if(!S.users[email]||S.users[email].pass!==pass){ S.authErr='Incorrect email or password.'; render(); return; }
    S.currentUser=email; S.currentRole='author';
    S.authErr=null; S.authOk=null; S.view='dash'; S.activeTab='manuscripts'; render(); return;
  }

  // Register
  const name=(document.getElementById('aN')?.value||'').trim();
  const inst=(document.getElementById('aI')?.value||'').trim();
  if(!name){ S.authErr='Please enter your name.'; render(); return; }
  if(email===EDITOR.email){ S.authErr='This email is reserved for the editor.'; render(); return; }
  if(S.users[email]){ S.authErr='An account with this email already exists.'; render(); return; }
  S.users[email]={name,pass,inst,email,role:'author'};
  await persist();
  S.authOk='Account created! You can now sign in.'; S.authMode='login'; S.authErr=null; render();
}

function logout(){ S.currentUser=null; S.currentRole=null; S.view='login'; S.authErr=null; S.authOk=null; render(); }

function myMss(){ return Object.values(S.manuscripts).filter(m=>m.owner===S.currentUser); }
function allMss(){ return Object.values(S.manuscripts); }

function renderDash(){
  const mss=myMss();
  const pendRev=mss.filter(m=>m.status==='revision_required').length;
  const tab=S.activeTab;
  return `<div class="dash">
  <nav class="sb">
    <div class="sb-sec">Submissions</div>
    <div class="sb-it ${tab==='manuscripts'?'active':''}" onclick="setTab('manuscripts')"><i class="ti ti-file-text" aria-hidden="true"></i> My manuscripts ${pendRev>0?`<span class="bdc">${pendRev}</span>`:''}</div>
    <div class="sb-it" onclick="startNew()"><i class="ti ti-plus" aria-hidden="true"></i> New submission</div>
    <div class="sb-sec">Account</div>
    <div class="sb-it ${tab==='profile'?'active':''}" onclick="setTab('profile')"><i class="ti ti-user" aria-hidden="true"></i> Profile</div>
  </nav>
  <div class="main">${tab==='manuscripts'?renderMyMss(mss):renderProfile()}</div>
  </div>`;
}

function renderMyMss(mss){
  if(!mss.length) return `<div class="ph"><div class="pt">My manuscripts</div></div><div class="empty-st"><i class="ti ti-file-off" aria-hidden="true"></i><p>No submissions yet.</p><button class="btn-new" onclick="startNew()"><i class="ti ti-plus" aria-hidden="true"></i> New submission</button></div>`;
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div class="ph" style="margin:0"><div class="pt">My manuscripts</div><div class="pd">Track your submissions</div></div><button class="btn-new" onclick="startNew()"><i class="ti ti-plus" aria-hidden="true"></i> New submission</button></div>
  <div class="ms-list">${mss.map(m=>{
    const isRev=m.status==='revision_required';
    return `<div class="ms-card"><div class="ms-head"><div class="ms-title">${m.title||'(Untitled)'}</div><span class="tag ${STATUS_CLASS[m.status]||'tag-draft'}">${STATUS_LABELS[m.status]||m.status}</span></div>
    <div class="ms-meta">${m.type||'—'} · Updated ${m.updated||'—'} · ${(m.files||[]).length} file(s)</div>
    <div class="ms-acts">
      <button class="btn-sm" onclick="openDetail('${m.id}')"><i class="ti ti-eye" aria-hidden="true"></i> View</button>
      ${m.status==='draft'?`<button class="btn-sm blue" onclick="editMs('${m.id}')"><i class="ti ti-edit" aria-hidden="true"></i> Continue</button>`:''}
      ${isRev?`<button class="btn-sm amber" onclick="editMs('${m.id}')"><i class="ti ti-upload" aria-hidden="true"></i> Submit revision</button>`:''}
    </div></div>`;
  }).join('')}</div>`;
}

function renderProfile(){
  const u=S.users[S.currentUser];
  return `<div class="ph"><div class="pt">Profile</div></div>
  <div class="fw" style="max-width:480px">
    <div class="fl"><label class="lbl">Full name</label><input class="inp" id="pN" value="${u?.name||''}" /></div>
    <div class="fl"><label class="lbl">Email</label><input class="inp" value="${u?.email||''}" disabled /></div>
    <div class="fl"><label class="lbl">Institution</label><input class="inp" id="pI" value="${u?.inst||''}" /></div>
    <button class="btn-new" onclick="saveProfile()" style="margin-top:6px"><i class="ti ti-device-floppy" aria-hidden="true"></i> Save</button>
  </div>`;
}

async function saveProfile(){
  const u=S.users[S.currentUser];
  u.name=document.getElementById('pN')?.value||u.name;
  u.inst=document.getElementById('pI')?.value||u.inst;
  await persist(); alert('Profile saved!');
}

function setTab(t){ S.activeTab=t; render(); }
function startNew(){ S.editingId=null; S.formStep=0; S.draftMs=initDraft(); S.view='form'; render(); }
function editMs(id){ S.editingId=id; S.draftMs=JSON.parse(JSON.stringify(S.manuscripts[id])); S.formStep=0; S.view='form'; render(); }
function openDetail(id){ S.viewingId=id; S.view='detail'; render(); }
function openReviewer(id){ S.viewingId=id; S.view='reviewer'; render(); }

function initDraft(){
  const u=S.users[S.currentUser]||{};
  return {id:uid(),title:'',type:'',abstract:'',keywords:'',authors:[{name:u.name||'',email:S.currentUser,inst:u.inst||'',corresponding:true}],files:[],status:'draft',owner:S.currentUser,ownerName:u.name||S.currentUser,created:dateStr(),updated:dateStr(),timeline:[{event:'Manuscript created',date:dateStr(),done:true}]};
}

const STEPS=['Type & details','Authors','Abstract','Files','Submit'];

function renderForm(){
  const ms=S.draftMs;
  const isRev=ms.status==='revision_required';
  let c='';
  if(S.formStep===0) c=rStep0(ms);
  else if(S.formStep===1) c=rStep1(ms);
  else if(S.formStep===2) c=rStep2(ms);
  else if(S.formStep===3) c=rStep3(ms);
  else if(S.formStep===4) c=rStep4(ms);
  const stepper=STEPS.map((s,i)=>{const cl=i<S.formStep?'done':i===S.formStep?'active':'';const dot=i<S.formStep?'<i class="ti ti-check" aria-hidden="true"></i>':i+1;return `<div class="step ${cl}"><div class="st-dot">${dot}</div><div class="st-lbl">${s}</div></div>`;}).join('');
  const back=S.formStep>0?`<button class="btn-back" onclick="prevStep()"><i class="ti ti-arrow-left" aria-hidden="true"></i> Back</button>`:`<button class="btn-back" onclick="backDash()"><i class="ti ti-arrow-left" aria-hidden="true"></i> Dashboard</button>`;
  const nextLbl=S.formStep===4?(isRev?'Submit revision':'Submit manuscript'):'Continue';
  return `<div class="main">
  ${isRev?`<div class="rev-alert"><div class="rev-alert-title"><i class="ti ti-alert-circle" aria-hidden="true"></i> Revision requested</div><div class="rev-alert-body">Address all reviewer comments and upload a revised manuscript before submitting.</div></div>`:''}
  <div class="ph"><div class="pt">${isRev?'Submit revision':S.editingId?'Continue submission':'New submission'}</div><div class="pd">Progress is saved at each step</div></div>
  <div class="fw"><div class="stepper">${stepper}</div>${c}
  <div class="form-nav">
    ${back}
    <span style="font-size:11px;color:var(--color-text-tertiary)"><i class="ti ti-device-floppy" aria-hidden="true"></i> Auto-saved</span>
    <button class="btn-new" onclick="nextStep()">${nextLbl} <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
  </div></div></div>`;
}

function rStep0(ms){
  const opts=MS_TYPES.map(t=>`<option ${ms.type===t?'selected':''}>${t}</option>`).join('');
  return `<div class="fst">Manuscript type & details</div><div class="fg1">
    <div class="ff"><label class="lbl">Type *</label><select class="sel" id="f_type"><option value="">Select…</option>${opts}</select></div>
    <div class="ff"><label class="lbl">Title *</label><input class="inp" id="f_title" placeholder="Full manuscript title" value="${ms.title||''}" /></div>
    <div class="ff"><label class="lbl">Running head</label><input class="inp" id="f_short" placeholder="Max 60 characters" value="${ms.shortTitle||''}" /></div>
    <div class="ff"><label class="lbl">Keywords</label><input class="inp" id="f_kw" placeholder="Separate with commas" value="${ms.keywords||''}" /></div>
  </div>`;
}
function rStep1(ms){
  const authors=ms.authors||[{name:'',email:'',inst:'',corresponding:true}];
  const rows=authors.map((a,i)=>`<div class="author-row">
    <div class="ff"><label class="lbl">Full name</label><input class="inp" id="a_n_${i}" value="${a.name||''}" /></div>
    <div class="ff"><label class="lbl">Email</label><input class="inp" id="a_e_${i}" value="${a.email||''}" /></div>
    <div class="ff"><label class="lbl">Institution</label><input class="inp" id="a_i_${i}" value="${a.inst||''}" /></div>
    <div><label class="lbl" style="visibility:hidden;font-size:10px">X</label><div style="display:flex;gap:4px">
      <button class="btn-icon ${a.corresponding?'star-on':''}" title="Corresponding author" onclick="setCorr(${i})"><i class="ti ti-star" aria-hidden="true"></i></button>
      ${authors.length>1?`<button class="btn-icon" onclick="removeAuthor(${i})" title="Remove"><i class="ti ti-trash" aria-hidden="true"></i></button>`:''}
    </div></div>
  </div>`).join('');
  return `<div class="fst">Authors</div>${rows}<div style="display:flex;gap:8px;align-items:center;margin-top:8px"><button class="btn-icon add" onclick="addAuthor()"><i class="ti ti-plus" aria-hidden="true"></i></button><span style="font-size:12px;color:var(--color-text-secondary)">Add author</span></div>`;
}
function rStep2(ms){
  return `<div class="fst">Abstract & details</div><div class="fg1">
    <div class="ff"><label class="lbl">Abstract * (150–300 words)</label><textarea class="ta" id="f_abs" style="min-height:130px">${ms.abstract||''}</textarea></div>
    <div class="ff"><label class="lbl">Highlights (optional)</label><textarea class="ta" id="f_hl" placeholder="• Finding 1&#10;• Finding 2">${ms.highlights||''}</textarea></div>
    <div class="ff"><label class="lbl">Suggested reviewers (optional)</label><textarea class="ta" id="f_sr" placeholder="Name, email, institution — one per line" style="min-height:65px">${ms.sugReviewers||''}</textarea></div>
  </div>`;
}
function rStep3(ms){
  const files=ms.files||[];
  const flist=files.length?`<div class="flist">${files.map((f,i)=>`<div class="fi"><i class="ti ti-file" aria-hidden="true" style="font-size:16px;color:var(--color-text-tertiary)"></i><span class="fn">${f.name}</span><span class="fc">${f.category}</span><span class="fs">${f.size}</span><button class="btn-icon" onclick="removeFile(${i})" style="flex-shrink:0"><i class="ti ti-x" aria-hidden="true"></i></button></div>`).join('')}</div>`:'';
  return `<div class="fst">Files</div>
  <div class="fg" style="margin-bottom:10px"><div class="ff"><label class="lbl">Category</label><select class="sel" id="f_fc"><option>Manuscript (main)</option><option>Cover letter</option><option>Supplementary material</option><option>Figures (high-res)</option><option>Revised manuscript</option><option>Response to reviewers</option><option>Data file</option><option>Other</option></select></div><div></div></div>
  <div class="file-drop" onclick="document.getElementById('fi2').click()"><i class="ti ti-cloud-upload" aria-hidden="true"></i><p>Click to select files</p><small>PDF, DOCX, ZIP, XLSX, PNG — max 50 MB</small></div>
  <input type="file" id="fi2" multiple style="display:none" onchange="handleFiles(this.files)" />
  ${flist}`;
}
function rStep4(ms){
  const authors=(ms.authors||[]).map(a=>`${a.name}${a.corresponding?' (corresponding)':''}`).join('; ');
  const isRev=ms.status==='revision_required';
  const revC=ms.reviewerComments||[];
  let rSec='';
  if(isRev&&revC.length) rSec=`<div style="margin-bottom:14px"><div class="fst">Reviewer comments to address</div>${revC.map((c,i)=>`<div class="rc"><div class="rc-lbl">Reviewer ${i+1}</div><div class="rc-text">${c}</div></div>`).join('')}</div>`;
  return `${rSec}<div class="fst">Review & ${isRev?'submit revision':'submit'}</div>
  <div class="rc" style="margin-bottom:12px"><div class="rc-lbl">Summary</div>
    <table style="font-size:12px;width:100%">
      <tr><td style="color:var(--color-text-secondary);padding:3px 0;width:110px">Type</td><td>${ms.type||'—'}</td></tr>
      <tr><td style="color:var(--color-text-secondary);padding:3px 0">Title</td><td>${ms.title||'—'}</td></tr>
      <tr><td style="color:var(--color-text-secondary);padding:3px 0">Authors</td><td>${authors||'—'}</td></tr>
      <tr><td style="color:var(--color-text-secondary);padding:3px 0">Files</td><td>${(ms.files||[]).length} attached</td></tr>
    </table>
  </div>
  <div class="rc"><div class="rc-lbl">Checklist</div>
    ${['Manuscript follows author guidelines','All authors approved this submission','Work is original and not under review elsewhere','Conflicts of interest declared','Data availability statement included'].map(it=>`<label class="cl-item"><input type="checkbox"> ${it}</label>`).join('')}
  </div>`;
}

function collectStep(step){
  const ms=S.draftMs;
  if(step===0){ms.type=document.getElementById('f_type')?.value||ms.type;ms.title=document.getElementById('f_title')?.value||ms.title;ms.shortTitle=document.getElementById('f_short')?.value||ms.shortTitle;ms.keywords=document.getElementById('f_kw')?.value||ms.keywords;}
  else if(step===1){const na=[];let i=0;while(document.getElementById(`a_n_${i}`)){na.push({name:document.getElementById(`a_n_${i}`).value,email:document.getElementById(`a_e_${i}`).value,inst:document.getElementById(`a_i_${i}`).value,corresponding:ms.authors[i]?.corresponding||false});i++;}ms.authors=na;}
  else if(step===2){ms.abstract=document.getElementById('f_abs')?.value||ms.abstract;ms.highlights=document.getElementById('f_hl')?.value||ms.highlights;ms.sugReviewers=document.getElementById('f_sr')?.value||ms.sugReviewers;}
  ms.updated=dateStr(); S.manuscripts[ms.id]=ms; persist();
}
function nextStep(){ collectStep(S.formStep); if(S.formStep===4){submitMs();return;} S.formStep++; render(); }
function prevStep(){ collectStep(S.formStep); S.formStep--; render(); }
function backDash(){ collectStep(S.formStep); S.view='dash'; S.activeTab='manuscripts'; render(); }

async function submitMs(){
  const ms=S.draftMs;
  if(!ms.title){ alert('Please add a title.'); return; }
  const isRev=ms.status==='revision_required';
  ms.status='submitted'; ms.updated=dateStr();
  if(!ms.timeline) ms.timeline=[];
  ms.timeline.push({event:isRev?'Revision submitted':'Manuscript submitted',date:dateStr(),done:true});
  S.manuscripts[ms.id]=ms;
  await persist();
  S.view='detail'; S.viewingId=ms.id; render();
}

function addAuthor(){ collectStep(1); S.draftMs.authors.push({name:'',email:'',inst:'',corresponding:false}); render(); }
function removeAuthor(i){ collectStep(1); S.draftMs.authors.splice(i,1); render(); }
function setCorr(i){ collectStep(1); S.draftMs.authors.forEach((a,j)=>a.corresponding=j===i); render(); }
function handleFiles(fl){
  const cat=document.getElementById('f_fc')?.value||'Manuscript (main)';
  Array.from(fl).forEach(f=>{const sz=f.size>1048576?(f.size/1048576).toFixed(1)+' MB':(f.size/1024).toFixed(0)+' KB';S.draftMs.files.push({name:f.name,category:cat,size:sz});});
  S.manuscripts[S.draftMs.id]=S.draftMs; persist(); render();
}
function removeFile(i){ S.draftMs.files.splice(i,1); render(); }

function renderDetail(){
  const ms=S.manuscripts[S.viewingId];
  if(!ms){S.view= isEditor(S.currentUser)?'admin':'dash';render();return'';}
  const isRev=ms.status==='revision_required';
  const revC=ms.reviewerComments||[];
  const isEd=isEditor(S.currentUser);
  const back=isEd?`<button class="btn-back" onclick="S.view='admin';render()"><i class="ti ti-arrow-left" aria-hidden="true"></i> All manuscripts</button>`:`<button class="btn-back" onclick="S.view='dash';S.activeTab='manuscripts';render()"><i class="ti ti-arrow-left" aria-hidden="true"></i> My manuscripts</button>`;
  const tlEvents=[{event:'Created',done:true,date:ms.created},{event:'Submitted',done:ms.status!=='draft',date:ms.status!=='draft'?ms.updated:null},{event:'Under review',done:['under_review','revision_required','accepted','rejected'].includes(ms.status),active:ms.status==='under_review'},{event:'Decision',done:['revision_required','accepted','rejected'].includes(ms.status)},{event:'Final',done:ms.status==='accepted'||ms.status==='rejected'}];
  return `<div class="main">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap">${back}<div class="pt">${ms.title||'(Untitled)'}</div><span class="tag ${STATUS_CLASS[ms.status]||'tag-draft'}">${STATUS_LABELS[ms.status]||ms.status}</span></div>
  ${isRev?`<div class="rev-alert"><div class="rev-alert-title"><i class="ti ti-alert-circle" aria-hidden="true"></i> Revision required</div><div class="rev-alert-body">Please address reviewer comments and upload a revised manuscript.</div></div>`:''}
  <div style="display:grid;grid-template-columns:1fr 230px;gap:14px">
    <div>
      <div class="fw" style="margin-bottom:12px">
        <div class="fst">Manuscript details</div>
        <table style="font-size:12px;width:100%;border-collapse:collapse">
          <tr><td style="color:var(--color-text-secondary);padding:4px 0;width:120px;vertical-align:top">Type</td><td>${ms.type||'—'}</td></tr>
          <tr><td style="color:var(--color-text-secondary);padding:4px 0;vertical-align:top">Authors</td><td>${(ms.authors||[]).map(a=>`${a.name}${a.corresponding?' <span style="font-size:10px;color:#185FA5">(corr.)</span>':''}`).join('<br/>')}</td></tr>
          <tr><td style="color:var(--color-text-secondary);padding:4px 0;vertical-align:top">Keywords</td><td>${ms.keywords||'—'}</td></tr>
          <tr><td style="color:var(--color-text-secondary);padding:4px 0;vertical-align:top">Abstract</td><td style="line-height:1.5">${ms.abstract||'—'}</td></tr>
          ${ms.highlights?`<tr><td style="color:var(--color-text-secondary);padding:4px 0;vertical-align:top">Highlights</td><td style="white-space:pre-line">${ms.highlights}</td></tr>`:''}
          <tr><td style="color:var(--color-text-secondary);padding:4px 0">Submitted by</td><td>${ms.ownerName||ms.owner}</td></tr>
          <tr><td style="color:var(--color-text-secondary);padding:4px 0">Updated</td><td>${ms.updated||'—'}</td></tr>
        </table>
      </div>
      ${(ms.files||[]).length?`<div class="fw" style="margin-bottom:12px"><div class="fst">Files (${(ms.files||[]).length})</div><div class="flist">${(ms.files||[]).map(f=>`<div class="fi"><i class="ti ti-file" aria-hidden="true" style="font-size:16px;color:var(--color-text-tertiary)"></i><span class="fn">${f.name}</span><span class="fc">${f.category}</span><span class="fs">${f.size}</span></div>`).join('')}</div></div>`:''}
      ${revC.length?`<div class="fw" style="margin-bottom:12px"><div class="fst">Reviewer comments</div>${revC.map((c,i)=>`<div class="rc"><div class="rc-lbl">Reviewer ${i+1}</div><div class="rc-text">${c}</div></div>`).join('')}${isRev&&!isEd?`<div style="margin-top:12px"><button class="btn-new" onclick="editMs('${ms.id}')"><i class="ti ti-upload" aria-hidden="true"></i> Upload revision</button></div>`:''}</div>`:''}
      ${isEd&&(ms.status==='submitted'||ms.status==='under_review')?`<div class="fw"><div class="fst">Editor actions</div><button class="btn-sm blue" onclick="openReviewer('${ms.id}')"><i class="ti ti-clipboard-check" aria-hidden="true"></i> Write review &amp; decision</button></div>`:''}
    </div>
    <div class="fw"><div class="fst">Editorial timeline</div>
      <div class="tl">${tlEvents.map(e=>`<div class="tl-item"><div class="tl-dot ${e.done?'done':(e.active?'active':'pend')}">${e.done?'<i class="ti ti-check" aria-hidden="true"></i>':(e.active?'<i class="ti ti-clock" aria-hidden="true"></i>':'')}</div><div><div class="tl-ev">${e.event}</div>${e.done&&e.date?`<div class="tl-dt">${e.date}</div>`:''}</div></div>`).join('')}</div>
    </div>
  </div></div>`;
}

function renderReviewer(){
  const ms=S.manuscripts[S.viewingId];
  if(!ms){S.view='admin';render();return'';}
  if(ms.status==='submitted'){ms.status='under_review';ms.updated=dateStr();if(!ms.timeline)ms.timeline=[];ms.timeline.push({event:'Review started',date:dateStr(),done:true});S.manuscripts[ms.id]=ms;persist();}
  return `<div class="main">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px"><button class="btn-back" onclick="S.view='admin';render()"><i class="ti ti-arrow-left" aria-hidden="true"></i> All manuscripts</button><div class="pt">Reviewing: ${ms.title||'(Untitled)'}</div></div>
  <div style="display:grid;grid-template-columns:1fr 250px;gap:14px">
    <div class="fw">
      <div class="fst">Manuscript overview</div>
      <table style="font-size:12px;width:100%;margin-bottom:16px">
        <tr><td style="color:var(--color-text-secondary);padding:3px 0;width:100px">Type</td><td>${ms.type||'—'}</td></tr>
        <tr><td style="color:var(--color-text-secondary);padding:3px 0">Authors</td><td>${(ms.authors||[]).map(a=>a.name).join(', ')||'—'}</td></tr>
        <tr><td style="color:var(--color-text-secondary);padding:3px 0;vertical-align:top">Abstract</td><td style="line-height:1.5">${ms.abstract||'—'}</td></tr>
      </table>
      <div class="fst">Evaluation</div>
      ${[['Scientific quality','Rigor, methodology, validity of results'],['Novelty','Originality and contribution to the field'],['Clarity','Writing quality, figures, logical structure'],['Completeness','Methods, data, references']].map(([l,d])=>`<div style="margin-bottom:14px"><label class="lbl">${l}</label><div style="font-size:11px;color:var(--color-text-tertiary);margin-bottom:5px">${d}</div><div style="display:flex;gap:12px">${['Poor','Fair','Good','Excellent'].map((r,i)=>`<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;color:var(--color-text-secondary)"><input type="radio" name="r_${l.replace(/\s/g,'_')}" value="${i+1}" style="accent-color:#185FA5"> ${r}</label>`).join('')}</div></div>`).join('')}
      <div class="ff" style="margin-bottom:12px"><label class="lbl">Comments to authors (will be shared with authors)</label><textarea class="ta" id="r_c" placeholder="Detailed, constructive feedback for the authors…" style="min-height:110px"></textarea></div>
      <div class="ff" style="margin-bottom:14px"><label class="lbl">Confidential notes to editor (not shared)</label><textarea class="ta" id="r_p" placeholder="Private notes for the editor only…" style="min-height:65px"></textarea></div>
      <div class="ff" style="margin-bottom:14px"><label class="lbl">Recommendation *</label>
        <select class="sel" id="r_d"><option value="">Select recommendation…</option><option>Accept as is</option><option>Minor revisions required</option><option>Major revisions required</option><option>Reject with invitation to resubmit</option><option>Reject</option></select>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn-new" onclick="submitReview()"><i class="ti ti-send" aria-hidden="true"></i> Submit decision</button>
        <button class="btn-sm" onclick="S.view='admin';render()">Save &amp; finish later</button>
      </div>
    </div>
    <div class="fw"><div class="fst">Review checklist</div>
      ${['Within scope of JHAE','Methods are reproducible','Results clearly presented','Conclusions supported by data','References are current','Statistical analysis correct','Data availability addressed'].map(it=>`<label class="cl-item"><input type="checkbox"> ${it}</label>`).join('')}
    </div>
  </div></div>`;
}

async function submitReview(){
  const ms=S.manuscripts[S.viewingId];
  const dec=document.getElementById('r_d')?.value;
  const comm=document.getElementById('r_c')?.value||'';
  if(!dec){alert('Please select a recommendation.');return;}
  const dm={'Accept as is':'accepted','Minor revisions required':'revision_required','Major revisions required':'revision_required','Reject with invitation to resubmit':'rejected','Reject':'rejected'};
  ms.status=dm[dec]||'under_review'; ms.updated=dateStr();
  if(comm.trim()){if(!ms.reviewerComments)ms.reviewerComments=[];ms.reviewerComments.push(comm.trim());}
  if(!ms.timeline)ms.timeline=[];
  ms.timeline.push({event:`Decision: ${dec}`,date:dateStr(),done:true});
  S.manuscripts[ms.id]=ms; await persist();
  alert(`Decision submitted: "${dec}". The author will see this when they next log in.`);
  S.view='admin'; render();
}

function renderAdmin(){
  const all=allMss();
  const filt=S.filterStatus==='all'?all:all.filter(m=>m.status===S.filterStatus);
  const counts={all:all.length,submitted:all.filter(m=>m.status==='submitted').length,under_review:all.filter(m=>m.status==='under_review').length,revision_required:all.filter(m=>m.status==='revision_required').length,accepted:all.filter(m=>m.status==='accepted').length,rejected:all.filter(m=>m.status==='rejected').length,draft:all.filter(m=>m.status==='draft').length};
  const tab=S.activeTab||'db';
  return `<div class="dash">
  <nav class="sb">
    <div class="sb-sec">Editorial</div>
    <div class="sb-it ${tab==='db'?'active':''}" onclick="S.activeTab='db';render()"><i class="ti ti-database" aria-hidden="true"></i> All manuscripts <span class="bdc">${counts.all}</span></div>
    <div class="sb-it ${tab==='users'?'active':''}" onclick="S.activeTab='users';render()"><i class="ti ti-users" aria-hidden="true"></i> Registered authors</div>
    <div class="sb-sec">Filter by status</div>
    ${[['submitted','Submitted',counts.submitted],['under_review','Under review',counts.under_review],['revision_required','Revision due',counts.revision_required],['accepted','Accepted',counts.accepted],['rejected','Rejected',counts.rejected]].map(([k,l,n])=>`<div class="sb-it" onclick="S.activeTab='db';S.filterStatus='${k}';render()" style="${S.filterStatus===k&&tab==='db'?'background:#E6F1FB;color:#185FA5;border-left-color:#378ADD;font-weight:500;border-left:3px solid #378ADD;':''}" ><i class="ti ti-filter" aria-hidden="true"></i> ${l} ${n>0?`<span class="bdc">${n}</span>`:''}</div>`).join('')}
  </nav>
  <div class="main">${tab==='db'?renderAdminDb(filt,counts):renderAdminUsers()}</div>
  </div>`;
}

function renderAdminDb(filt,counts){
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div class="ph" style="margin:0"><div class="pt">Manuscript database</div><div class="pd">${filt.length} record(s)</div></div>
    <button class="btn-sm" onclick="S.filterStatus='all';render()"><i class="ti ti-refresh" aria-hidden="true"></i> Show all</button>
  </div>
  <div class="stat-row">
    <div class="stat-card"><div class="stat-lbl">Total submissions</div><div class="stat-val">${counts.all}</div></div>
    <div class="stat-card"><div class="stat-lbl">Awaiting review</div><div class="stat-val">${counts.submitted+counts.under_review}</div></div>
    <div class="stat-card"><div class="stat-lbl">Accepted</div><div class="stat-val" style="color:#3B6D11">${counts.accepted}</div></div>
    <div class="stat-card"><div class="stat-lbl">Rejected</div><div class="stat-val" style="color:#A32D2D">${counts.rejected}</div></div>
  </div>
  <div class="filter-row">
    ${[['all','All'],['submitted','Submitted'],['under_review','Under review'],['revision_required','Revision req.'],['accepted','Accepted'],['rejected','Rejected'],['draft','Draft']].map(([k,l])=>`<button class="filter-btn ${S.filterStatus===k?'active':''}" onclick="S.filterStatus='${k}';render()">${l}</button>`).join('')}
  </div>
  ${filt.length===0?`<div class="empty-st"><i class="ti ti-inbox" aria-hidden="true"></i><p>No manuscripts in this category.</p></div>`:
  `<div class="fw" style="padding:0;overflow:hidden"><table class="db-table" style="table-layout:fixed">
    <colgroup><col style="width:30%"><col style="width:14%"><col style="width:14%"><col style="width:13%"><col style="width:13%"><col style="width:16%"></colgroup>
    <thead><tr><th>Title</th><th>Type</th><th>Author</th><th>Status</th><th>Updated</th><th>Actions</th></tr></thead>
    <tbody>${filt.sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).map(m=>`<tr>
      <td style="font-weight:500">${m.title||'(Untitled)'}</td>
      <td style="color:var(--color-text-secondary)">${(m.type||'—').split(' ')[0]}</td>
      <td style="color:var(--color-text-secondary)">${m.ownerName||m.owner||'—'}</td>
      <td><span class="tag ${STATUS_CLASS[m.status]||'tag-draft'}">${STATUS_LABELS[m.status]||m.status}</span></td>
      <td style="color:var(--color-text-tertiary)">${m.updated||'—'}</td>
      <td><div style="display:flex;gap:5px">
        <button class="btn-sm" onclick="openDetail('${m.id}')"><i class="ti ti-eye" aria-hidden="true"></i></button>
        ${m.status==='submitted'||m.status==='under_review'?`<button class="btn-sm blue" onclick="openReviewer('${m.id}')"><i class="ti ti-clipboard-check" aria-hidden="true"></i></button>`:''}
      </div></td>
    </tr>`).join('')}</tbody>
  </table></div>`}`;
}

function renderAdminUsers(){
  const users=Object.values(S.users);
  const msByUser={};
  Object.values(S.manuscripts).forEach(m=>{if(!msByUser[m.owner])msByUser[m.owner]=[];msByUser[m.owner].push(m);});
  return `<div class="ph"><div class="pt">Registered authors</div><div class="pd">${users.length} user(s)</div></div>
  ${users.length===0?`<div class="empty-st"><i class="ti ti-users" aria-hidden="true"></i><p>No registered authors yet.</p></div>`:
  `<div class="fw" style="padding:0;overflow:hidden"><table class="db-table" style="table-layout:fixed">
    <colgroup><col style="width:22%"><col style="width:28%"><col style="width:26%"><col style="width:12%"><col style="width:12%"></colgroup>
    <thead><tr><th>Name</th><th>Email</th><th>Institution</th><th>Role</th><th>Manuscripts</th></tr></thead>
    <tbody>${users.map(u=>`<tr>
      <td style="font-weight:500">${u.name||'—'}</td>
      <td style="color:var(--color-text-secondary)">${u.email}</td>
      <td style="color:var(--color-text-secondary)">${u.inst||'—'}</td>
      <td><span class="tag tag-sub">${u.role||'author'}</span></td>
      <td style="color:var(--color-text-secondary)">${(msByUser[u.email]||[]).length}</td>
    </tr>`).join('')}</tbody>
  </table></div>`}`;
}

loadStorage();
</script>
